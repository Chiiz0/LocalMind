query copilotWorkbenchProjectsGet($includeArchived: Boolean = false) {
  currentUser {
    copilot {
      contextProjects(includeArchived: $includeArchived) {
        id
        createdByUserId
        name
        description
        status
        aiPolicy
        role
        members {
          userId
          name
          email
          avatarUrl
          role
          createdAt
        }
        canManage
        createdAt
        updatedAt
      }
    }
  }
}
