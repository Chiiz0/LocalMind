mutation copilotContextProjectCreate($input: CreateCopilotContextProjectInput!) {
  createCopilotContextProject(input: $input) {
    id
    createdByUserId
    name
    description
    status
    aiPolicy
    role
    members {
      userId
      name
      email
      avatarUrl
      role
      createdAt
    }
    canManage
    createdAt
    updatedAt
  }
}
