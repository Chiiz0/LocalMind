#import "./fragments/copilot-chat-history.gql"

query projectCopilotChats($projectId: String!, $pagination: PaginationInput!, $options: QueryChatHistoriesInput) {
  currentUser {
    copilot {
      projectChats(projectId: $projectId, pagination: $pagination, options: $options) {
        totalCount
        edges {
          cursor
          node { ...CopilotChatHistory }
        }
        pageInfo { hasNextPage endCursor }
      }
    }
  }
}
